name: Verificações do SCOM

on:
  push:
    branches:
      - main
      - fix/estabilidade-site
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualidade:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, tokenizer, xml
          coverage: none

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validar configuração do Composer
        run: composer validate --strict

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Gerar APP_KEY
        run: php artisan key:generate

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Gerar build de produção (Vite)
        run: npm run build

      - name: Verificar sintaxe PHP
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Executar testes automatizados
        run: php artisan test

      - name: Verificar sintaxe JavaScript do painel
        run: node --check public/assets/js/painel_estudante.js
  qualidade-mariadb:
    name: Testes em MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: scom_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Criar .env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=scom_test/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Instalar dependências JS
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Rodar migrations no MariaDB
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: scom_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Rodar testes no MariaDB
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: scom_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
